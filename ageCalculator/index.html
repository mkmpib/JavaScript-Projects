<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h1>JavaScript <br><span>Age Calculator</span></h1>
         <div class="input-box">
            <input type="date" id="date">
            <button onclick="calculateAge()">Calculate</button>

         </div>
         <p id="result"></p>
        </div>
    </div>
    <script>
        let userInput=document.getElementById("date");
    //    userInput.max=new Date().toISOString().split("t")[0];//so we can not calculate the dates in future
        let result=document.getElementById("result");
        function  calculateAge(){
        let birthDate=new Date(userInput.value);
        let d1=birthDate.getDate();
        let m1=birthDate.getMonth()+1;//becuse init the month will initisle start with 0 so we give here incriment by 1
        let y1=birthDate.getFullYear();
        

        let today=new Date();//current date store hogi
        let d2=today.getDate();
        let m2=today.getMonth()+1;
        let y2=today.getFullYear();

        //variable that show the difference between today and birthdate
        let d3,m3,y3;
        y3=y2-y1;
        if(m2>=m1){
            m3=m2-m1;
        }else{
            y3++;//++ fir lgaya hai ager dob bdi hogi current year s fir ye shi answer de -- me negative aa raha tha
            m3=12+m2-m1;

        }
        if(d2>=d1){
            d3=d2-d1;
        }else{
        m3--;
        // d3=31+d2-d1;
        d3=getDaysInMonth(y1,m1)+d2-d1;
        }
        if(m3<0){
            m3=11;
            y3--;
        }
        console.log(m3,d3,y3);
        result.innerHTML=`You are <span>${m3}</span> Months,<span>${d3}</span> Days,<span>${y3}</span> Years old`;
        }
        //the below function return the how many days in the birth month
        function getDaysInMonth(year,month){
            return new Date(year,month,0).getDate();

        }


    </script>
</body>
</html>
